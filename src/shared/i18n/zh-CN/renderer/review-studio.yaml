    zones:
      mid-own: 中路（己方半场）
      mid-enemy: 中路（敌方半场）
      top-own: 上路（己方半场）
      top-enemy: 上路（敌方半场）
      bot-own: 下路（己方半场）
      bot-enemy: 下路（敌方半场）
      river-top: 上河道（男爵侧）
      river-bot: 下河道（小龙侧）
      jungle-own-top: 己方上半野区
      jungle-own-bot: 己方下半野区
      jungle-enemy-top: 敌方上半野区
      jungle-enemy-bot: 敌方下半野区
      own-base: 己方基地
      enemy-base: 敌方基地
  outcomeGap:
    title: 赢的局和输的局，差在哪
    hint: 逐项比较赢局与输局的前期数据，差别越明显排得越靠前。
    empty: 先在上方读取并分析历史对局，再比较赢局和输局
    sample: '{{games}} 场 · {{wins}} 胜 {{losses}} 负'
    fewGames: 样本偏少，结论只能当线索
    notEnough: '赢局和输局至少各需要 {{count}} 场才能比较，请扩大分析范围。'
    legacy: '另有 {{count}} 场旧存档只有经济差和补刀差，重新分析后可补齐其余指标。'
    habit: 习惯与决策
    habitHint: 你能直接调整的做法，优先看这里。
    result: 对线结果
    resultHint: 反映前期打得顺不顺。差别大通常是结果，不一定是原因。
    winSide: 赢的局
    lossSide: 输的局
    samples: '{{count}} 场'
    strength:
      clear: 差别明显
      possible: 可能有差别
      none: 看不出差别
      insufficient: 样本不足
    unknown: 有效对局太少，暂时无法比较
    same: 赢局和输局基本一样
    duration: '{{minutes}} 分 {{seconds}} 秒'
    durationSeconds: '{{seconds}} 秒'
    diff:
      time:
        more: '输的局通常晚 {{value}}'
        less: '输的局通常早 {{value}}'
      count:
        more: '输的局平均多 {{value}} 次'
        less: '输的局平均少 {{value}} 次'
      plates:
        more: '输的局平均多 {{value}} 层'
        less: '输的局平均少 {{value}} 层'
      gold:
        more: '输的局通常多 {{value}} 金币'
        less: '输的局通常少 {{value}} 金币'
      cs:
        more: '输的局通常多 {{value}} 刀'
        less: '输的局通常少 {{value}} 刀'
    trackHint: 色带是该组中间一半对局的范围，竖线是典型值；两条色带重叠越多，差别越不可靠。
    noValues: 没有可用数值
    valuesHint: 点击数值可打开对应的那一局。
    note: 这里只说明赢局和输局有什么不同，不能直接当成输的原因：落后本身也会让装备变慢、死亡变多。“差别明显”表示两组数据分得比较开，并非百分之百确定；同时比较十几项，个别差别也可能只是巧合。
    metrics:
      deathsBefore10:
        name: 10 分钟前死亡次数
        hint: 开局到 10:00 之前的死亡次数。
      soloDeathsBefore14:
        name: 前 14 分钟被单杀
        hint: 只有一名敌方英雄参与的死亡次数。
      jungleDeathsBefore14:
        name: 前 14 分钟被打野抓死
        hint: 敌方打野作为击杀者或助攻者的死亡次数。
      firstShopAt:
        name: 首次回家补给时间
        hint: 2 分钟之后第一次购买物品的时间，阵亡复活后的购买也算。
      wardsBefore10:
        name: 10 分钟前放置守卫
        hint: 饰品眼、控制守卫和辅助装的眼，不含其它视野效果。
      controlWardsBefore15:
        name: 15 分钟前放置控制守卫
        hint: 15:00 之前放下的控制守卫数量。
      roamsBefore14:
        name: 前 14 分钟去边路的次数
        hint: 仅中路。按每分钟一次的位置快照统计进入上、下路的次数，一分钟内来回的短游走可能漏记。
      cs10:
        name: 10 分钟补刀
        hint: 10 分钟快照中的补刀数，含野怪。
      csDiff10:
        name: 10 分钟对位补刀差
        hint: 相对同位置对手，正值为领先。
      goldDiff10:
        name: 10 分钟对位经济差
        hint: 相对同位置对手的累计经济，正值为领先。
      goldDiff15:
        name: 15 分钟对位经济差
        hint: 相对同位置对手的累计经济，正值为领先。
      plateDiff:
        name: 前 14 分钟本路镀层差
        hint: 本路拿到的镀层数减去丢掉的镀层数，正值为领先；打野不统计。
      takedownsBefore14:
        name: 前 14 分钟参与击杀
        hint: 击杀加助攻的次数。
      firstCoreItemAt:
        name: 第一件成装完成时间
        hint: 第一次买下由散件合成、总价不低于 2200 金币的装备的时间，不含鞋子。
